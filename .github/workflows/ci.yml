name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: docker build -t moroshka:test .
      - name: Smoke test container
        run: |
          docker run -d --name notes -p 127.0.0.1:18090:8090 -e MOROSHKA_TOKEN="$(openssl rand -hex 32)" moroshka:test
          curl --retry 10 --retry-all-errors --retry-delay 1 --fail http://localhost:18090/healthz
      - run: python3 deploy/package-installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: moroshka-server-installer
          path: release/Moroshka-Server.pyz
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Android variants (bounded retry for transient repository errors)
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/moroshka-gradle.log"
          for attempt in 1 2 3; do
            if ./gradlew :app:assembleDebug :app:assembleRelease :app:assemblePreview :app:assembleDebugAndroidTest 2>&1 | tee "$log"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eqi 'Received status code (429|502|503|504)|Read timed out|Connection timed out|Connection reset' "$log"; then
              exit 1
            fi
            echo "Temporary dependency repository error; retry $attempt of 2"
            sleep "$((attempt * 30))"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: moroshka-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moroshka-android-preview
          path: android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: moroshka-android-instrumentation
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  android-runtime:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moroshka-android-debug
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: moroshka-android-instrumentation
          path: candidate
      - name: Run real Android instrumentation on a disposable emulator
        run: bash tests/android-runtime.sh candidate/app-debug.apk candidate/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-logs
          path: runtime-logs/
          if-no-files-found: warn

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: node server/prepare-ocr.mjs
      - run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-screenshots
          path: ux-artifacts/
          if-no-files-found: warn

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[preview-release]')
    needs: [server, android, android-runtime, browser]
    runs-on: ubuntu-latest
    environment: preview-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moroshka-android-preview
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: moroshka-server-installer
          path: release
      - name: Require original preview signing certificate and publish
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          PREVIEW_KEY_ALIAS: ${{ secrets.PREVIEW_KEY_ALIAS }}
          PREVIEW_STORE_PASSWORD: ${{ secrets.PREVIEW_STORE_PASSWORD }}
          PREVIEW_KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
        run: bash deploy/publish-preview.sh candidate/app-preview.apk
