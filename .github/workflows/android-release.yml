name: Release signed Android APK
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: moroshka-android-release
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleRelease
        working-directory: android
      - name: Sign, verify and publish APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          store="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$store"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$store"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          version=$("$tools/aapt" dump badging "$apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          artifact="Moroshka-Notes-$version.apk"
          "$tools/apksigner" sign --ks "$store" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$artifact" "$apk"
          "$tools/apksigner" verify --verbose "$artifact"
          gh release create "v$version" "$artifact" --target "$GITHUB_SHA" --title "Moroshka Notes $version" --generate-notes

