name: Release compatible Android alpha
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [deploy/alpha-release-request.json]
permissions:
  contents: read
concurrency:
  group: moroshka-alpha-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
      - run: python deploy/package-installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: moroshka-server-installer
          path: release/Moroshka-Server.pyz
          if-no-files-found: error
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: moroshka-alpha-build-test-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moroshka-alpha-build-test-only
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: moroshka-server-installer
          path: release
      - name: Sign with original alpha key and verify upgrade compatibility
        env:
          ALPHA_KEYSTORE_BASE64: ${{ secrets.ALPHA_KEYSTORE_BASE64 }}
          ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
          ALPHA_STORE_PASSWORD: ${{ secrets.ALPHA_STORE_PASSWORD }}
          ALPHA_KEY_PASSWORD: ${{ secrets.ALPHA_KEY_PASSWORD }}
        run: bash deploy/sign-alpha.sh
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat release/VERSION)
          gh release create "v$version" release/Moroshka-Notes-"$version".apk release/Moroshka-Server.pyz release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Moroshka Notes $version" --prerelease --generate-notes
