<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FCF5F2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#211B29" media="(prefers-color-scheme: dark)"><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/style.css"><title>Moroshka Notes</title><script type="module" src="/app.js"></script></head>
<body>
<div class="shell">
<aside><div class="brand"><img src="/assets/cloudberry.webp" width="48" height="48" alt=""><div>Морошка<small>Заметки · Знания</small></div></div>
<button id="new" class="primary">＋ Новая заметка</button>
<nav aria-label="Библиотека"><button class="nav-notes" data-view="notes" aria-current="page">Заметки</button><button class="nav-tasks" data-view="tasks">Задачи</button></nav>
<div class="connection"><span id="status" role="status">На этом устройстве</span><button id="connect">Подключение</button><button id="sync">Синхронизировать</button></div></aside>
<main><div class="top"><span>Моя библиотека</span><button id="import">Импорт .md</button><input id="file" type="file" accept=".md,text/markdown,text/plain" multiple hidden></div>
<div class="hero"><strong>Мысли в знания,<br>идеи в проекты</strong></div>
<form id="capture" class="composer">
<label for="capture-text">О чём вы думаете?</label>
<textarea id="capture-text" rows="3" placeholder="Запишите мысль, идею или задачу"></textarea>
<div class="capture-actions"><span id="capture-status" role="status">Сохраняется на этом устройстве</span><button class="primary" type="submit">Сохранить</button></div>
</form>
<header><h1 id="heading">Заметки</h1><span id="count"></span></header>
<label class="search"><span class="search-icon" aria-hidden="true"></span><input type="search" id="search" aria-label="Поиск" placeholder="Найти заметку или #тег"></label>
<div id="items"></div></main>
<section id="reader" hidden><div class="readerBar"><button id="close" aria-label="Закрыть редактор">← Библиотека</button><button id="export">Скачать .md</button></div>
<label for="body">Markdown</label><textarea id="body" spellcheck="true" placeholder="# Название заметки"></textarea>
<div class="editorActions"><span id="saved" role="status"></span><button id="summary" class="summary-button">Резюме в OpenRouter</button></div>
<div id="related"></div></section></div>
<dialog id="settings"><h2>Подключить устройство</h2>
<p>На телефоне откройте «Подключить другое устройство» и введите этот код.</p>
<div id="pair-code" class="pair-code" aria-live="polite">Получаем код…</div>
<p id="pair-status" role="status">Код действует две минуты.</p>
<button id="pair-retry" hidden>Получить новый код</button>
<details><summary>Ввести ключ вручную</summary><form method="dialog">
<label for="key">Ключ синхронизации</label><input type="password" id="key" autocomplete="off">
<div class="row"><button value="save" class="primary">Подключить</button></div></form></details>
<form method="dialog"><div class="row"><button value="cancel">Закрыть</button></div></form></dialog>
<dialog id="message"><h2 id="msgTitle"></h2><p id="msgText"></p><form method="dialog"><button>Закрыть</button></form></dialog>
</body></html>
