<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Морошка 2.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#fcf5f2;color:#48374e;font:16px/1.5 system-ui}main{max-width:480px;margin:auto;padding:20px 16px 100px}h1{font-size:26px;margin:0}h2{font-size:19px}small{color:#69536d}section,article{background:white;border:1px solid #ebdddc;border-radius:20px;padding:16px;margin:12px 0}textarea,input{font:inherit;width:100%;padding:12px;border:1px solid #d8c5d4;border-radius:12px;background:transparent;color:inherit}button{font:inherit;min-height:48px;border:0;border-radius:14px;padding:10px 16px;color:#48374e;background:#f8e8f1;cursor:pointer}button.primary{background:linear-gradient(120deg,#b84f3b,#794298);color:white}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #79518c}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);display:flex;background:white;padding:8px;gap:4px;border-radius:20px 20px 0 0}nav button{flex:1;padding:6px;font-size:13px}nav button.active{background:#f9ded6}article button{width:100%;text-align:left;background:transparent;padding:0} .row{display:flex;gap:8px;justify-content:space-between;align-items:center}.tag{display:inline-block;margin:4px;font-size:13px}p{white-space:pre-wrap;overflow-wrap:anywhere} @media(prefers-color-scheme:dark){body{background:#211b29;color:#fff4f5}section,article,nav{background:#302638;border-color:#514257}button{background:#46334e;color:#fff4f5}small{color:#d3bed3}nav button.active{background:#654153}}
</style><main><header><h1>✿ Морошка</h1><small>Пространство ваших мыслей</small></header><div id="view"></div><small>Демонстрация: данные только в памяти страницы. ИИ и микрофон не подключены.</small></main><nav id="nav"></nav><script>
const $=s=>document.querySelector(s);let notes=[{id:1,title:'Принципы хорошего интерфейса',body:'Минимум действий, максимум функционала, эффектов и красоты.',tags:['Дизайн'],links:[]},{id:2,title:'Организация знаний',body:'Связи помогают находить идеи.',tags:['Знания'],links:[]}],page='home',selected=1,draft='';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(p){page=p;render()}function openNote(id){selected=id;go('detail')}function cards(ns){return ns.map(n=>`<article><button onclick="openNote(${n.id})"><strong>${esc(n.title)}</strong><p>${esc(n.body.slice(0,120))}</p><small>${esc(n.tags.join(' · '))}</small></button></article>`).join('')||'<p>Нет заметок</p>'}function save(){if(!draft.trim())return;let id=Date.now();notes.unshift({id,title:draft.trim().split(/[\n.!?]/)[0].slice(0,65)||'Новая заметка',body:draft,tags:[],links:[]});draft='';openNote(id)}function render(){let n=notes.find(n=>n.id===selected);$('#nav').innerHTML=[['home','Главная'],['search','Поиск'],['links','Связи'],['library','Библиотека']].map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('');let v=$('#view');if(page==='home')v.innerHTML=`<section><h2>Новая мысль</h2><textarea rows="4" aria-label="Текст заметки" placeholder="О чём вы думаете?" oninput="draft=this.value">${esc(draft)}</textarea><div class="row"><button onclick="alert('Микрофон в прототипе не подключён')">Голос</button><button class="primary" onclick="save()">Сохранить</button></div></section><h2>Недавние</h2>${cards(notes.slice(0,4))}`;if(page==='library')v.innerHTML='<h2>Библиотека</h2>'+cards(notes);if(page==='search'){v.innerHTML='<h2>Поиск</h2><input aria-label="Поиск" placeholder="Найти мысль или тему" oninput="filter(this.value)"><div id="results">'+cards(notes)+'</div>'}if(page==='detail')v.innerHTML=`<section><button onclick="go('home')">← Назад</button><h2>${esc(n.title)}</h2><button onclick="rename()">Редактировать заголовок</button><p>${esc(n.body)}</p><h2>Теги</h2>${n.tags.map((t,i)=>`<button class="tag" onclick="removeTag(${i})">${esc(t)} ×</button>`).join('')}<div class="row"><input id="tag" placeholder="Новый тег"><button onclick="addTag()">+</button></div><h2>Предложения ИИ</h2><small>Автоматический анализ не подключён.</small><h2>Связанные заметки</h2>${cards(notes.filter(x=>n.links.includes(x.id)))}<button onclick="go('links')">Управлять связями</button></section>`;if(page==='links')v.innerHTML=`<h2>Связи знаний</h2><section><strong>${esc(n.title)}</strong><p>Ручные связи с другими заметками</p>${notes.filter(x=>x.id!==n.id).map(x=>`<p class="row"><span>${esc(x.title)}</span><button onclick="toggleLink(${x.id})">${n.links.includes(x.id)?'Удалить':'Связать'}</button></p>`).join('')}</section>`}function filter(q){$('#results').innerHTML=cards(notes.filter(n=>(n.title+' '+n.body+' '+n.tags.join(' ')).toLowerCase().includes(q.toLowerCase())))}function rename(){let n=notes.find(x=>x.id===selected),t=prompt('Заголовок',n.title);if(t?.trim())n.title=t.trim();render()}function addTag(){let n=notes.find(x=>x.id===selected),t=$('#tag').value.trim();if(t&&!n.tags.includes(t))n.tags.push(t);render()}function removeTag(i){notes.find(x=>x.id===selected).tags.splice(i,1);render()}function toggleLink(id){let a=notes.find(x=>x.id===selected),b=notes.find(x=>x.id===id);if(a.links.includes(id)){a.links=a.links.filter(x=>x!==id);b.links=b.links.filter(x=>x!==a.id)}else{a.links.push(id);b.links.push(a.id)}render()}render();</script></html>
